<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>密码保险箱</title>

  <!-- Content Security Policy（内联脚本/onclick 依赖 unsafe-inline，本次未做内联迁移） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ipc: http://ipc.localhost" />

  <!-- PWA -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="安全本地存储的密码管理器" />
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="密码保险箱" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div id="app"></div>

<!-- Vendor 库按需懒加载（QR 功能触发时动态注入，不阻塞首屏） -->

<!-- PWA Service Worker 注册（页面渲染完再注册，不阻塞首屏） -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then((reg) => {
        console.log('[LockPass] Service Worker 已注册:', reg.scope);
      }).catch((err) => {
        console.warn('[LockPass] Service Worker 注册失败:', err);
      });
    });
  }
</script>

<!-- 应用模块（defer 保证按序执行，不阻塞 HTML 解析） -->
<script defer src="js/template.js"></script>
<script defer src="js/crypto.js"></script>
<script defer src="js/database.js"></script>
<!-- Tauri 文件存储层：桌面环境用本地文件替代 IndexedDB（浏览器下无副作用，须位于 database.js 之后） -->
<script defer src="js/file-store.js"></script>
<script defer src="js/file-sync.js"></script>
<script defer src="js/generator.js"></script>
<script defer src="js/utils.js"></script>
<!-- Tauri 桥接层：仅桌面环境生效，浏览器下无副作用（须位于 utils.js 之后、业务模块之前） -->
<script defer src="js/tauri-bridge.js"></script>
<script defer src="js/related.js"></script>
<script defer src="js/particles.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/entries.js"></script>
<script defer src="js/editor.js"></script>
<script defer src="js/import-export.js"></script>
<script defer src="js/qr-sync.js"></script>
<script defer src="js/settings.js"></script>
<script defer src="js/shortcuts.js"></script>
<script defer src="js/main.js"></script>

</body>
</html>
