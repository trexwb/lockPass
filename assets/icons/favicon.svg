<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40e0d0"/>
      <stop offset="0.45" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#008b8b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b2ebf2"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- 左侧铰链（3D 凸块） -->
  <rect x="23" y="40" width="7" height="13" rx="2.5" fill="#00d4aa"/>
  <rect x="23" y="60" width="7" height="13" rx="2.5" fill="#00d4aa"/>
  <!-- 保险箱主体 -->
  <rect x="30" y="28" width="46" height="50" rx="9" fill="url(#safe)"/>
  <!-- 顶部高光 -->
  <rect x="30" y="28" width="46" height="9" rx="4.5" fill="#ffffff" opacity="0.25"/>
  <!-- 转盘：银白外环 + 青色内盘 -->
  <circle cx="53" cy="55" r="14" fill="url(#ring)"/>
  <circle cx="53" cy="55" r="10" fill="#00bfa0"/>
  <!-- 内盘高光点 -->
  <circle cx="50" cy="51.5" r="3" fill="#ffffff" opacity="0.85"/>
  <!-- 锁孔中心 -->
  <circle cx="53" cy="56" r="2.6" fill="#0d1117"/>
</svg>
