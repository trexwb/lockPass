[package]
name = "lockpass"
version = "1.0.5"
description = "LockPass 个人密码工作台 (Tauri 桌面封装)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lockpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
arboard = "3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# macOS 专用：生物识别解锁（Passkey）依赖 CoreFoundation 类型桥接，
# 直接 FFI 调用 Security / Secure Enclave（无新增系统权限，非沙盒可签发）
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
