<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
        <rect x="4" y="11" width="16" height="10" rx="2" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </svg>
      <span>LockPass 自动填充</span>
    </header>

    <div id="state-locked" class="state-box hidden">
      <svg class="state-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <p id="locked-title">LockPass 未解锁</p>
      <p id="locked-hint" class="hint">请先打开并解锁 LockPass 主应用（浏览器版 / 在线版），解锁后本扩展自动就绪。</p>
      <button id="btn-pair" class="btn hidden">连接桌面版 LockPass</button>
    </div>

    <div id="state-pairing" class="state-box hidden">
      <svg class="state-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <p>正在等待桌面端确认…</p>
      <p class="hint">请在 LockPass 桌面应用中点击「允许配对」，确认数字一致：</p>
      <div id="pair-nonce" class="nonce">——</div>
      <p id="pair-hint" class="hint">如已取消或长时间无响应，可关闭本弹窗重新连接。</p>
    </div>

    <div id="state-empty" class="state-box hidden">
      <svg class="state-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      <p id="empty-title">没有匹配的密码条目</p>
      <p id="empty-hint" class="hint">当前密码库为空，或当前网站没有可关联的条目。点击下方按钮查看全部条目。</p>
      <button id="btn-all" class="btn">显示全部</button>
    </div>

    <div id="state-ready" class="hidden">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" class="search" type="text" placeholder="搜索标题 / 账号 / 网址" autocomplete="off">
      </div>
      <ul id="entry-list" class="entry-list"></ul>
      <p id="no-match" class="hint hidden">没有匹配的条目</p>
    </div>

    <footer class="popup-footer">
      <span id="status-text" class="status">检测中…</span>
      <label id="trust-file-row" class="trust-row hidden" title="默认关闭：本地文件页面可能伪装成 LockPass 应用接收登录凭据">
        <input id="trust-file" type="checkbox">
        <span>允许本地文件页面接收捕获凭据</span>
      </label>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
