# ═══════════════════════════════════════════════════════════════════
# LockPass — 在线版（浏览器版）部署到 GitHub Pages
# ───────────────────────────────────────────────────────────────────
# 触发：main 分支推送 或 手动 workflow_dispatch（可选任意分支）
# 做了什么：
#   1. npm ci 安装依赖
#   2. node scripts/copy-frontend.mjs（内部执行 npm run vite:build）生成 dist/（外置资源产物，iife 脚本 file:// 可用）
#   3. 将 extension/ 目录打包为双版本放入 dist/（随站点一起发布）：
#      - Chrome/Edge:  lockpass-extension-v<版本>.zip
#      - Firefox:      lockpass-extension-v<版本>-firefox.xpi
#   4. 将 dist/ 部署到 GitHub Pages
# 部署后访问：https://trexwb.github.io/lockPass/
# 扩展包下载：<同地址>/lockpass-extension-v<版本>.zip（Chrome/Edge）
#            <同地址>/lockpass-extension-v<版本>-firefox.xpi（Firefox，about:debugging 临时加载）
#   （具体地址以仓库 Settings → Pages 显示为准）
#
# ⚠️ 首次使用需在仓库 Settings → Pages → Build and deployment →
#    Source 选择 "GitHub Actions"（一次性配置）
#
# 说明：在线版与桌面版数据相互独立（在线版数据存访问者浏览器
#   IndexedDB），可通过 .vault 导出/导入互通。
# ═══════════════════════════════════════════════════════════════════

name: Deploy Web Version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新推送会取消进行中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 生成 dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Vue/Vite 构建需要依赖，先安装（使用 lockfile 保证可复现）
      - name: 安装依赖
        run: npm ci

      # copy-frontend.mjs 内部执行 npm run vite:build（vite build 单文件内联，仅前端产物）
      - name: 构建生成 dist
        run: node scripts/copy-frontend.mjs

      - name: 验证 dist 产物
        run: ls -la dist/ && test -f dist/index.html

      # 浏览器扩展打包进站点根目录：Chrome/Edge 解压 zip 后「加载已解压的扩展程序」直接使用；
      # Firefox 使用 xpi 通过 about:debugging 临时加载（gecko 变体 manifest 由脚本派生：
      # browser_specific_settings.gecko + background.scripts 声明）。
      # 版本号取自 extension/manifest.json（由 npm run version:set 统一同步）。
      # 注意：GitHub Actions 默认 bash 带 -e，-o pipefail，任一命令失败即中断整步、
      # 导致已生成的 Chrome zip 无法随 Pages 发布；故 web-ext 安装与 xpi 校验均设为
      # 尽力而为（不阻断 Chrome zip 发布），Firefox 失败由 build-extension.mjs 内部兜底。
      - name: 打包浏览器扩展（Chrome zip + Firefox xpi）
        run: |
          npm install -g web-ext || echo "WARN: web-ext 安装失败，将回退系统 zip 生成 Firefox xpi"
          node scripts/build-extension.mjs
          EXT_VER=$(node -p "require('./extension/manifest.json').version")
          # Chrome zip 为关键产物：缺失则直接失败
          test -s "dist/lockpass-extension-v${EXT_VER}.zip" || { echo "ERROR: Chrome zip 缺失"; exit 1; }
          echo "extension zip: lockpass-extension-v${EXT_VER}.zip"
          # Firefox xpi 为尽力而为：缺失仅告警，不影响 Chrome zip 发布
          if [ -s "dist/lockpass-extension-v${EXT_VER}-firefox.xpi" ]; then
            echo "firefox xpi: lockpass-extension-v${EXT_VER}-firefox.xpi"
          else
            echo "WARN: Firefox xpi 未生成（不影响 Chrome zip 发布）"
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
