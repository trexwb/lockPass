# ═══════════════════════════════════════════════════════════════════
# LockPass — 提交前置检查
# ───────────────────────────────────────────────────────────────────
# 触发：push 到 dev/main + 所有 PR（含 Dependabot 的依赖更新 PR）
# 作用：在合并/发布前验证 Cargo.lock 与依赖树自洽（--locked 严格
#       校验 checksum），从源头拦截"发布 tag 后才爆构建错误"。
# ═══════════════════════════════════════════════════════════════════

name: Check

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  cargo-check:
    name: cargo check --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # Tauri 依赖树（gtk/webkit2gtk/glib-sys 等）在 ubuntu 上编译
      # 必须预装系统库，否则 glib-sys/gobject-sys 的 build script 失败
      - name: 安装系统依赖（Tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      # rust-cache 加速 PR 反复构建；lock 已修复，缓存不再有
      # checksum 错配风险（此前的 itoa 问题是 lock 文件损坏，
      # 不是缓存问题）
      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 校验依赖树并编译检查
        working-directory: src-tauri
        run: cargo check --locked

      - name: 运行测试（如有）
        working-directory: src-tauri
        run: cargo test --locked || true
