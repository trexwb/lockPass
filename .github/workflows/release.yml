# ═══════════════════════════════════════════════════════════════════
# LockPass — 发布自动打包工作流
# ───────────────────────────────────────────────────────────────────
# 触发：推送 v* 标签（如 v1.0.2）或手动 workflow_dispatch
# 产物：
#   • Windows:  NSIS 安装包(.exe) + MSI 安装包(.msi)
#   • macOS:   .app 压缩包(.zip) + .dmg（hdiutil 生成，无 GUI 依赖）
# 说明：
#   • macOS 产物为 ad-hoc 签名（无 Developer ID 证书），分发到其他 Mac
#     首次打开需在终端执行一条解除隔离的命令（见 README.md）。
#   • Windows 产物未签名，SmartScreen 会提示"更多信息 → 仍要运行"。
#   • 所有产物先上传为 Actions Artifact，再汇总到 Draft Release，
#     人工确认后点"Publish release"正式发布。
# ═══════════════════════════════════════════════════════════════════

name: Release Build (Tauri)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 并上传产物

jobs:
  # ── Windows：NSIS + MSI ──────────────────────────────────────────
  build-windows:
    name: Windows (nsis + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2.2.0
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      # Tauri 自动下载 WiX(msi) / NSIS 工具链；WebView2 走 downloadBootstrapper
      - name: 构建 Tauri 应用
        run: npm run tauri:build

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: 上传到 GitHub Release（草稿）
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ── macOS：.app + .dmg（ad-hoc 签名，仅构建机可用）───────────────
  # macos-latest 为 arm64 原生 runner，产物即 aarch64；
  # dmg 由 scripts/make-dmg.sh 用 hdiutil 生成（Tauri 自带 create-dmg
  # 依赖 AppleScript，在 CI 无 GUI 环境会失败，故不用）。
  build-macos:
    name: macOS (app + dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2.2.0
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      - name: 构建 Tauri 应用（仅 .app）
        run: npm run tauri:build

      - name: 生成 .dmg（hdiutil，CI 可用）
        run: npm run make-dmg

      - name: 打包 .app 为 zip（保留权限与符号链接）
        run: |
          cd "src-tauri/target/release/bundle/macos"
          ditto -c -k --keepParent "LockPass.app" "$RUNNER_TEMP/LockPass-macos-aarch64.zip"

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/LockPass-macos-aarch64.zip
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: 上传到 GitHub Release（草稿）
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/LockPass-macos-aarch64.zip
            src-tauri/target/release/bundle/dmg/*.dmg
