# ═══════════════════════════════════════════════════════════════════
# LockPass — 发布自动打包工作流
# ───────────────────────────────────────────────────────────────────
# 触发：推送 v* 标签（如 v1.0.2）或手动 workflow_dispatch
# 产物：
#   • Windows:  NSIS 安装包(.exe) + MSI 安装包(.msi)
#   • macOS:   .app 压缩包(.zip) + .dmg（hdiutil 生成，无 GUI 依赖）
# 说明：
#   • macOS 产物为 ad-hoc 签名（无 Developer ID 证书），分发到其他 Mac
#     首次打开需在终端执行一条解除隔离的命令（见 README.md）。
#   • Windows 产物未签名，SmartScreen 会提示"更多信息 → 仍要运行"。
#   • 所有产物先上传为 Actions Artifact，再汇总到 Draft Release，
#     人工确认后点"Publish release"正式发布。
# 自动更新（v1.0.11 起）：
#   • bundle.createUpdaterArtifacts 生成更新产物与 .sig 签名
#     （Windows: NSIS setup.exe；macOS: LockPass.app.tar.gz）
#   • 签名私钥存 GitHub Variables：TAURI_SIGNING_PRIVATE_KEY
#     （私钥密码为空，无需 PASSWORD 变量；本地私钥 ~/.tauri/lockpass-updater.key）
#   • update-manifest job 汇总产物生成 latest.json 随 Release 发布，
#     客户端经 plugins.updater.endpoints 指向 releases/latest/download/latest.json
#   • 注意：Draft Release 未 Publish 前 latest.json 下载 404，属预期
# ═══════════════════════════════════════════════════════════════════

name: Release Build (Tauri)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 并上传产物

jobs:
  # ── Windows：NSIS + MSI ──────────────────────────────────────────
  build-windows:
    name: Windows (nsis + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      # Tauri 自动下载 WiX(msi) / NSIS 工具链；WebView2 走 downloadBootstrapper
      - name: 构建 Tauri 应用
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ variables.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ variables.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi

      - name: 上传到 GitHub Release（草稿）
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi

  # ── macOS：.app + .dmg（ad-hoc 签名，仅构建机可用）───────────────
  # macos-latest 为 arm64 原生 runner，产物即 aarch64；
  # dmg 由 scripts/make-dmg.sh 用 hdiutil 生成（Tauri 自带 create-dmg
  # 依赖 AppleScript，在 CI 无 GUI 环境会失败，故不用）。
  build-macos:
    name: macOS (app + dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 cargo 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      # N3 修复：发布前校验全仓版本号一致性
      - name: 校验版本号一致性
        run: npm run version:check

      - name: 构建 Tauri 应用（仅 .app）
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ variables.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ variables.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 生成 .dmg（hdiutil，CI 可用）
        run: npm run make-dmg

      # N2 修复：按 runner 实际架构命名 zip，不再硬编码 aarch64
      - name: 计算构建架构
        id: arch
        run: |
          A="$(uname -m)"
          [ "$A" = "arm64" ] && A="aarch64"
          echo "arch=$A" >> "$GITHUB_OUTPUT"

      - name: 打包 .app 为 zip（保留权限与符号链接）
        run: |
          cd "src-tauri/target/release/bundle/macos"
          ditto -c -k --keepParent "LockPass.app" "$RUNNER_TEMP/LockPass-macos-${{ steps.arch.outputs.arch }}.zip"

      - name: 上传产物到 Actions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundles
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/LockPass-macos-${{ steps.arch.outputs.arch }}.zip
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: 上传到 GitHub Release（草稿）
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/LockPass-macos-${{ steps.arch.outputs.arch }}.zip
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg

  # ── 更新清单：汇总双平台产物生成 latest.json ──────────────────────
  # 客户端 updater 读取 releases/latest/download/latest.json 判断新版本。
  update-manifest:
    name: 生成更新清单 (latest.json)
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v7
        with:
          name: windows-bundles
          path: artifacts/windows

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v7
        with:
          name: macos-bundles
          path: artifacts/macos

      - name: 生成 latest.json
        run: node scripts/gen-latest-json.mjs --win artifacts/windows --mac artifacts/macos --out latest.json

      - name: 上传到 GitHub Release（草稿）
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: latest.json
