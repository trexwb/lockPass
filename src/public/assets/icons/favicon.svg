<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 背景：青绿色渐变（对齐 app-icon.png 主色） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#46e2c2"/>
      <stop offset="0.45" stop-color="#1ed0ab"/>
      <stop offset="1" stop-color="#0b9c82"/>
    </linearGradient>
    <!-- 顶部高光（3D 光泽） -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景：圆角青绿方块 -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- 顶部高光弧 -->
  <path d="M22 12 L78 12 Q90 12 90 24 L90 34 Q90 26 82 26 L18 26 Q10 26 10 34 L10 24 Q10 12 22 12 Z" fill="url(#sheen)"/>

  <!-- 盾牌（Lucide shield，与启动屏 / SvgIcons.shield 同一路径，白色填充居中） -->
  <g transform="translate(50,50) scale(2.6) translate(-12,-12)">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#ffffff"/>
  </g>
</svg>
