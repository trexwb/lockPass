  <script>
    // file:// 下 manifest 加载会触发 CORS 拦截（'file:' unique origin），
    // 仅 http/https 部署环境（GitHub Pages / Tauri）才注入 manifest。
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      var m = document.createElement('link')
      m.rel = 'manifest'
      m.href = './manifest.json'
      document.head.appendChild(m)
    }
  </script>
  <meta name="theme-color" content="#0f172a" data-page-node-id="fC2rXXCL6jRJe88ANtxawS" />
  <style>
    /* ═══ 启动屏（Splash Screen）═══
       内联于 index.html：在 JS / CSS 变量 / 组件加载完成前立即渲染，
       替代白屏等待。Vue mount 时用 App 内容整体替换 #app，本层自动移除。
       仅 CSS 动画（无 JS）：Tauri CSP script-src 'self' 禁内联脚本，
       style-src 'unsafe-inline' 允许内联样式。色值硬编码对齐锁屏渐变
       （--lock-bg-1/2/3），因 CSS 变量此时尚未加载。 */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        radial-gradient(1100px 700px at 50% 28%, rgba(88, 166, 255, 0.10) 0%, rgba(88, 166, 255, 0) 60%),
        radial-gradient(1400px 900px at 85% 110%, rgba(88, 166, 255, 0.06) 0%, rgba(88, 166, 255, 0) 55%),
        linear-gradient(180deg, #0d1524 0%, #0a0e16 55%, #060910 100%);
      /* 淡出过渡：main.js 在 App 挂载后添加 .splash-exit 触发，避免「瞬间消失」 */
      transition: opacity 0.4s ease;
    }
    #splash.splash-exit {
      opacity: 0;
      pointer-events: none;
    }
    #splash::before {
      content: '';
      position: absolute;
      inset: -25%;
      background:
        radial-gradient(720px 480px at 32% 30%, rgba(88, 166, 255, 0.14) 0%, rgba(88, 166, 255, 0) 60%),
        radial-gradient(640px 420px at 72% 68%, rgba(70, 226, 194, 0.10) 0%, rgba(70, 226, 194, 0) 58%);
      animation: splash-aurora 9s ease-in-out infinite alternate;
      pointer-events: none;
    }
    #splash .splash-logo {
      position: relative;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      animation: splash-float 2.6s ease-in-out infinite;
    }
    #splash .splash-logo::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(70, 226, 194, 0.20) 0%, rgba(70, 226, 194, 0) 70%);
      animation: splash-glow 2.6s ease-in-out infinite;
    }
    #splash .splash-icon {
      width: 54px;
      height: 54px;
      color: #46e2c2;
      filter: drop-shadow(0 0 12px rgba(70, 226, 194, 0.45));
    }
    #splash .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #e6edf3;
      letter-spacing: 0.02em;
    }
    #splash .splash-dots { display: flex; gap: 8px; }
    #splash .splash-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #46e2c2;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    #splash .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
    #splash .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splash-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes splash-dot {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    @keyframes splash-glow {
      0%, 100% { opacity: 0.55; transform: scale(0.92); }
      50%      { opacity: 1;    transform: scale(1.08); }
    }
    @keyframes splash-aurora {
      0%   { transform: translate3d(-4%, -2%, 0) scale(1);   opacity: 0.7; }
      100% { transform: translate3d(4%, 3%, 0)  scale(1.12); opacity: 1;   }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash::before,
      #splash .splash-logo,
      #splash .splash-logo::before,
      #splash .splash-dots span { animation: none; }
    }
  </style>
